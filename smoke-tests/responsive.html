<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Test Page</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; }
    #breakpoint::after { content: 'desktop'; }
    @media (max-width: 900px) { #breakpoint::after { content: 'tablet'; } }
    @media (max-width: 600px) { #breakpoint::after { content: 'mobile'; } }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    .cell { background: #e8e8ff; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <h1>Responsive Test Page</h1>
  <p>Active breakpoint: <strong id="breakpoint"></strong></p>
  <p>Viewport: <span id="size"></span> (<span id="resizes">0</span> resize events)</p>
  <div class="grid">
    <div class="cell">A</div>
    <div class="cell">B</div>
    <div class="cell">C</div>
  </div>
  <script>
    let resizeCount = 0;
    const render = () => {
      document.getElementById('size').textContent = innerWidth + 'x' + innerHeight;
      document.getElementById('resizes').textContent = String(resizeCount);
    };
    addEventListener('resize', () => { resizeCount++; render(); });
    render();
  </script>
</body>
</html>
